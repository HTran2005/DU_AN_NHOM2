trigger:
  branches:
    include:
      - main
      - feature/*

pool:
  vmImage: ubuntu-latest

variables:
  organization: 'DuAnNhom2'
  project: 'BAO_CAO'

steps:

# =========================================================
# 1. CHECKOUT SOURCE
# =========================================================

- checkout: self
  fetchDepth: 0


# =========================================================
# 2. LẤY TẤT CẢ WORK ITEM ID TỪ COMMIT
# Ví dụ commit:
# Implement Microsoft Entra ID AB#34
# => lấy được ID 34
# Quét toàn bộ commit trong lần push, có thể lấy nhiều ID
# =========================================================

- script: |

    echo "======================================"
    echo "COMMIT INFORMATION"
    echo "======================================"

    # Lay toan bo AB#ID tu 20 commit gan nhat (du cho push nhieu commit)
    WORKITEM_IDS=$(git log -20 --pretty=%B | grep -oE 'AB#[0-9]+' | grep -oE '[0-9]+' | sort -un | tr '\n' ' ')

    # Neu khong co trong commit, thu lay tu ten nhanh: feature/AB123-ten
    if [ -z "$WORKITEM_IDS" ]; then
      echo "Khong thay AB# trong commit, thu tim trong ten nhanh: $BRANCH_NAME"
      WORKITEM_IDS=$(echo "$BRANCH_NAME" | grep -oE 'AB[0-9]+' | grep -oE '[0-9]+' | sort -un | tr '\n' ' ')
    fi

    if [ -z "$WORKITEM_IDS" ]; then
      echo "Khong tim thay AB#ID trong commit hoac ten nhanh."
      echo "Pipeline van tiep tuc."
      exit 0
    fi

    echo "Found Work Item IDs: $WORKITEM_IDS"

    echo "##vso[task.setvariable variable=WORKITEM_IDS]$WORKITEM_IDS"

  displayName: "Get Work Item IDs"

  env:
    BRANCH_NAME: $(Build.SourceBranchName)


# =========================================================
# 3. NEW -> ACTIVE (cho tất cả ID)
# =========================================================

- script: |

    if [ -z "$(WORKITEM_IDS)" ]; then
      echo "Khong co Work Item ID."
      exit 0
    fi

    if [ -z "$PAT" ]; then
      echo "Thieu bien PAT. Khong the cap nhat trang thai."
      exit 0
    fi

    echo "======================================"
    echo "CHANGE WORK ITEMS TO ACTIVE"
    echo "======================================"

    for WORKITEM_ID in $(WORKITEM_IDS); do

      echo "Work Item: $WORKITEM_ID"

      RESPONSE=$(curl --http1.1 -s \
        --user ":$PAT" \
        "https://dev.azure.com/$(organization)/$(project)/_apis/wit/workitems/$WORKITEM_ID?api-version=7.1")

      CURRENT_STATE=$(echo "$RESPONSE" | grep -oE '"System.State":[[:space:]]*"[^"]+"' | head -1 | cut -d'"' -f4)

      if [ -z "$CURRENT_STATE" ]; then
        echo "DEBUG - khong doc duoc trang thai. Phan hoi tu API:"
        echo "$RESPONSE" | head -c 300
        echo ""
      fi

      echo "Trang thai hien tai: $CURRENT_STATE"

      if [ "$CURRENT_STATE" = "New" ]; then
        curl --http1.1 \
          --fail-with-body \
          --user ":$PAT" \
          -X PATCH \
          -H "Content-Type: application/json-patch+json" \
          "https://dev.azure.com/$(organization)/$(project)/_apis/wit/workitems/$WORKITEM_ID?api-version=7.1" \
          --data '[
            {
              "op": "add",
              "path": "/fields/System.State",
              "value": "Active"
            }
          ]'

        echo ""
        echo "Work Item $WORKITEM_ID -> Active"
      else
        echo "Work Item $WORKITEM_ID dang o trang thai '$CURRENT_STATE', khong can chuyen sang Active."
      fi

    done

  displayName: "Set Work Items Active"

  env:
    PAT: $(PAT)


# =========================================================
# 4. HIỂN THỊ SOURCE
# =========================================================

- script: |

    echo "======================================"
    echo "PROJECT STRUCTURE"
    echo "======================================"

    pwd
    ls -R

  displayName: "Show Project Structure"


# =========================================================
# 5. KIỂM TRA PHP
# =========================================================

- script: |

    echo "======================================"
    echo "PHP VERSION"
    echo "======================================"

    php -v

  displayName: "Check PHP Version"


# =========================================================
# 6. VALIDATE PHP
# =========================================================

- script: |

    echo "======================================"
    echo "VALIDATE PHP"
    echo "======================================"

    find . -name "*.php" -exec php -l {} \;

  displayName: "Validate PHP"


# =========================================================
# 7. CÀI COMPOSER
# =========================================================

- script: |

    echo "======================================"
    echo "INSTALL COMPOSER"
    echo "======================================"

    cd backend

    composer install --prefer-dist --no-progress --no-dev

  displayName: "Install Composer Dependencies"


# =========================================================
# 8. KIỂM TRA SQL
# =========================================================

- script: |

    echo "======================================"
    echo "SQL FILES"
    echo "======================================"

    find . -name "*.sql"

  displayName: "Find SQL Scripts"


# =========================================================
# 9. ĐÓNG GÓI SOURCE
# =========================================================

- task: ArchiveFiles@2

  displayName: "Create Artifact"

  inputs:
    rootFolderOrFile: '$(Build.SourcesDirectory)'
    includeRootFolder: false
    archiveType: zip
    archiveFile: '$(Build.ArtifactStagingDirectory)/Website.zip'
    replaceExistingArchive: true


# =========================================================
# 10. PUBLISH ARTIFACT
# =========================================================

- task: PublishBuildArtifacts@1

  displayName: "Publish Artifact"

  inputs:
    PathtoPublish: '$(Build.ArtifactStagingDirectory)'
    ArtifactName: Website


# =========================================================
# 11. ACTIVE -> RESOLVED (cho tất cả ID)
# =========================================================

- script: |

    if [ -z "$(WORKITEM_IDS)" ]; then
      echo "Khong co Work Item ID."
      exit 0
    fi

    if [ -z "$PAT" ]; then
      echo "Thieu bien PAT. Khong the cap nhat trang thai."
      exit 0
    fi

    echo "======================================"
    echo "CHANGE WORK ITEMS TO RESOLVED"
    echo "======================================"

    for WORKITEM_ID in $(WORKITEM_IDS); do

      echo "Work Item: $WORKITEM_ID"

      RESPONSE=$(curl --http1.1 -s \
        --user ":$PAT" \
        "https://dev.azure.com/$(organization)/$(project)/_apis/wit/workitems/$WORKITEM_ID?api-version=7.1")

      CURRENT_STATE=$(echo "$RESPONSE" | grep -oE '"System.State":[[:space:]]*"[^"]+"' | head -1 | cut -d'"' -f4)

      if [ -z "$CURRENT_STATE" ]; then
        echo "DEBUG - khong doc duoc trang thai. Phan hoi tu API:"
        echo "$RESPONSE" | head -c 300
        echo ""
      fi

      echo "Trang thai hien tai: $CURRENT_STATE"

      if [ "$CURRENT_STATE" = "Active" ]; then
        curl --http1.1 \
          --fail-with-body \
          --user ":$PAT" \
          -X PATCH \
          -H "Content-Type: application/json-patch+json" \
          "https://dev.azure.com/$(organization)/$(project)/_apis/wit/workitems/$WORKITEM_ID?api-version=7.1" \
          --data '[
            {
              "op": "add",
              "path": "/fields/System.State",
              "value": "Resolved"
            }
          ]'

        echo ""
        echo "Work Item $WORKITEM_ID -> Resolved"
      else
        echo "Work Item $WORKITEM_ID dang o trang thai '$CURRENT_STATE', khong can chuyen sang Resolved."
      fi

    done

  displayName: "Set Work Items Resolved"

  condition: succeeded()

  env:
    PAT: $(PAT)
