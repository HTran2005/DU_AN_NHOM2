trigger:
- main

pool:
  vmImage: ubuntu-latest

variables:
  organization: 'DuAnNhom2'
  project: 'BAO_CAO'
steps:

- checkout: self
- script: |
    COMMIT_MSG=$(git log -1 --pretty=%B)

    echo "Commit:"
    echo "$COMMIT_MSG"

    WORKITEM=$(echo "$COMMIT_MSG" | grep -oE 'AB#[0-9]+' | grep -oE '[0-9]+')

    echo "Found Work Item: $WORKITEM"

    echo "##vso[task.setvariable variable=WORKITEM_ID]$WORKITEM"
  displayName: "Get Work Item ID"
- script: |
    echo "WORKITEM_ID=$(WORKITEM_ID)"
    echo "Organization=$(organization)"
    echo "Project=$(project)"

    if [ -z "$(WORKITEM_ID)" ]; then
      echo "No Work Item found"
      exit 1
    fi

    JSON='[
      {
        "op": "add",
        "path": "/fields/System.State",
        "value": "Active"
      }
    ]'

    AUTH=$(printf ":%s" "$PAT" | base64)

    curl -v \
      --request PATCH \
      --url "https://dev.azure.com/$(organization)/$(project)/_apis/wit/workitems/$(WORKITEM_ID)?api-version=7.1" \
      --header "Authorization: Basic $AUTH" \
      --header "Content-Type: application/json-patch+json" \
      --data "$JSON"

  displayName: "Set Active"
  env:
    PAT: $(PAT)
- script: |
    echo "===== PROJECT ====="
    pwd
    ls -R
  displayName: "Show Project Structure"

- script: php -v
  displayName: "Check PHP"

- script: |
    find . -name "*.php" -exec php -l {} \;
  displayName: "Validate PHP"

- script: |
    find . -name "*.sql"
  displayName: "Find SQL"

- task: ArchiveFiles@2
  inputs:
    rootFolderOrFile: '$(Build.SourcesDirectory)'
    includeRootFolder: false
    archiveType: zip
    archiveFile: '$(Build.ArtifactStagingDirectory)/Website.zip'
    replaceExistingArchive: true

- task: PublishBuildArtifacts@1
  inputs:
    PathtoPublish: '$(Build.ArtifactStagingDirectory)'
    ArtifactName: Website
- script: |

    if [ -z "$(WORKITEM_ID)" ]; then
      echo "No Work Item"
      exit 0
    fi

    AUTH=$(printf ":%s" "$(PAT)" | base64)

    curl -X PATCH \
      -H "Content-Type: application/json-patch+json" \
      -H "Authorization: Basic $AUTH" \
      "https://dev.azure.com/$(organization)/$(project)/_apis/wit/workitems/$(WORKITEM_ID)?api-version=7.1" \
      -d '[
      {
        "op":"add",
        "path":"/fields/System.State",
        "value":"Resolved"
      }]'
  env:
    PAT: $(PAT)

  displayName: "Set Resolved"

  condition: succeeded()