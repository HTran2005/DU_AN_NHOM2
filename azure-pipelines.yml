trigger:
- main

pool:
  vmImage: ubuntu-latest

steps:

- checkout: self

# Hiển thị source
- script: |
    echo "===== PROJECT ====="
    pwd
    ls -R
  displayName: "Show Project Structure"

# Kiểm tra PHP
- script: |
    php -v
  displayName: "Check PHP Version"

# Validate PHP
- script: |
    find . -name "*.php" -exec php -l {} \;
  displayName: "Validate PHP"

# Kiểm tra SQL
- script: |
    find . -name "*.sql"
  displayName: "Find SQL Scripts"

# Đóng gói source
- task: ArchiveFiles@2
  displayName: "Create Artifact"
  inputs:
    rootFolderOrFile: '$(Build.SourcesDirectory)'
    includeRootFolder: false
    archiveType: zip
    archiveFile: '$(Build.ArtifactStagingDirectory)/Website.zip'
    replaceExistingArchive: true

# Publish Artifact
- task: PublishBuildArtifacts@1
  displayName: "Publish Artifact"
  inputs:
    PathtoPublish: '$(Build.ArtifactStagingDirectory)'
    ArtifactName: Website