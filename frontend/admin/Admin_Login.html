<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login - Tripto</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #052461 0%, #0d47a1 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .login-wrapper {
            width: 100%;
            max-width: 420px;
            padding: 20px;
        }

        .login-card {
            background: white;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            overflow: hidden;
            animation: slideUp 0.5s ease;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .login-header {
            background: linear-gradient(135deg, #052461 0%, #0d47a1 100%);
            color: white;
            padding: 40px 30px;
            text-align: center;
        }

        .login-header i {
            font-size: 48px;
            margin-bottom: 15px;
            display: block;
        }

        .login-header h1 {
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 8px;
        }

        .login-header p {
            font-size: 14px;
            opacity: 0.9;
        }

        .login-body {
            padding: 40px 30px;
        }

        .form-group {
            margin-bottom: 24px;
        }

        .form-group label {
            display: block;
            font-size: 14px;
            font-weight: 600;
            color: #052461;
            margin-bottom: 8px;
        }

        .form-group input {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid #e9ecef;
            border-radius: 8px;
            font-size: 14px;
            transition: all 0.3s;
            font-family: 'Inter', sans-serif;
        }

        .form-group input:focus {
            outline: none;
            border-color: #052461;
            box-shadow: 0 0 0 3px rgba(5, 36, 97, 0.1);
        }

        .form-group input::placeholder {
            color: #adb5bd;
        }

        .login-btn {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #052461 0%, #0d47a1 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            margin-top: 10px;
        }

        .login-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(5, 36, 97, 0.3);
        }

        .login-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .alert {
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 14px;
            display: none;
            animation: slideDown 0.3s ease;
        }

        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .alert.show {
            display: block;
        }

        .alert-error {
            background: rgba(220, 53, 69, 0.1);
            color: #dc3545;
            border: 1px solid rgba(220, 53, 69, 0.3);
        }

        .alert-success {
            background: rgba(25, 135, 84, 0.1);
            color: #198754;
            border: 1px solid rgba(25, 135, 84, 0.3);
        }

        .login-footer {
            text-align: center;
            padding: 20px 30px;
            background: #f8f9fa;
            color: #6c757d;
            font-size: 13px;
        }

        .loading {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-right: 8px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .btn-loading {
            opacity: 0.8;
            pointer-events: none;
        }
    </style>
</head>
<body>
    <div class="login-wrapper">
        <div class="login-card">
            <!-- Header -->
            <div class="login-header">
                <i class="fas fa-shield-alt"></i>
                <h1>Tripto Admin</h1>
                <p>Đăng Nhập Quản Trị Viên</p>
            </div>

            <!-- Body -->
            <div class="login-body">
                <!-- Alert -->
                <div id="alert" class="alert"></div>

                <!-- Login Form -->
                <form id="loginForm">
                    <!-- Email -->
                    <div class="form-group">
                        <label for="email">
                            <i class="fas fa-envelope" style="color: #052461; margin-right: 8px;"></i>Email
                        </label>
                        <input 
                            type="email" 
                            id="email" 
                            name="email" 
                            placeholder="Nhập email admin" 
                            required
                        >
                    </div>

                    <!-- Password -->
                    <div class="form-group">
                        <label for="password">
                            <i class="fas fa-lock" style="color: #052461; margin-right: 8px;"></i>Mật Khẩu
                        </label>
                        <input 
                            type="password" 
                            id="password" 
                            name="password" 
                            placeholder="Nhập mật khẩu" 
                            required
                        >
                    </div>

                    <!-- Login Button -->
                    <button type="submit" class="login-btn" id="loginBtn">
                        <i class="fas fa-sign-in-alt" style="margin-right: 8px;"></i>Đăng Nhập
                    </button>
                </form>
            </div>

            <!-- Footer -->
            <div class="login-footer">
                <i class="fas fa-info-circle"></i> Chỉ tài khoản admin mới có thể truy cập
            </div>
        </div>
    </div>

    <script>
        const loginForm = document.getElementById('loginForm');
        const loginBtn = document.getElementById('loginBtn');
        const alertEl = document.getElementById('alert');
        const emailInput = document.getElementById('email');
        const passwordInput = document.getElementById('password');

        // Show alert
        function showAlert(message, type) {
            alertEl.textContent = message;
            alertEl.className = `alert show alert-${type}`;
        }

        // Clear alert
        function clearAlert() {
            alertEl.className = 'alert';
            alertEl.textContent = '';
        }

        // Handle form submission
        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            clearAlert();

            const email = emailInput.value.trim();
            const password = passwordInput.value.trim();

            if (!email || !password) {
                showAlert('Vui lòng nhập đầy đủ email và mật khẩu', 'error');
                return;
            }

            // Show loading state
            loginBtn.disabled = true;
            loginBtn.classList.add('btn-loading');
            loginBtn.innerHTML = '<span class="loading"></span>Đang xử lý...';

            try {
                // Call API
                const response = await fetch('../../backend/admin.php', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        action: 'admin_login',
                        email: email,
                        password: password
                    })
                });

                const data = await response.json();

                if (data.success) {
                    // Save admin info to localStorage
                    localStorage.setItem('adminName', data.admin.name);
                    localStorage.setItem('adminEmail', data.admin.email);
                    localStorage.setItem('adminId', data.admin.id);
                    
                    showAlert('✓ Đăng nhập thành công! Chuyển hướng...', 'success');
                    setTimeout(() => {
                        window.location.href = 'Trangchu_ad.html';
                    }, 1500);
                } else {
                    showAlert('✗ ' + (data.message || 'Đăng nhập thất bại'), 'error');
                }
            } catch (error) {
                console.error('Error:', error);
                showAlert('✗ Lỗi kết nối. Vui lòng thử lại.', 'error');
            } finally {
                loginBtn.disabled = false;
                loginBtn.classList.remove('btn-loading');
                loginBtn.innerHTML = '<i class="fas fa-sign-in-alt" style="margin-right: 8px;"></i>Đăng Nhập';
            }
        });

        // Clear alert when user types
        emailInput.addEventListener('input', clearAlert);
        passwordInput.addEventListener('input', clearAlert);

        // Auto-focus email on load
        window.addEventListener('load', () => {
            emailInput.focus();
        });
    </script>
</body>
</html>
